name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formato, dependencias, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist
          retention-days: 7

  deploy:
    name: Publicar en Cloudflare
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Revisar credenciales de Cloudflare
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Faltan los secretos de Cloudflare; se omite la publicación (ver docs/publicacion.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: apps/client/dist
      - name: Publicar el servidor (solo main)
        if: steps.creds.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: pnpm --filter @crisol/server run deploy
      - name: Publicar el juego web (main o vista previa del PR)
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/server
        run: |
          pnpm exec wrangler pages project create crisol-de-ysmar --production-branch main || true
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          pnpm exec wrangler pages deploy ../client/dist --project-name crisol-de-ysmar --branch "$BRANCH"
